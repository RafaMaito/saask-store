version: '3.8'

# Manifesto de Orquestração de Contêineres (Container Orchestration Manifest)
services:
  # 1. Serviço de Banco de Dados Documental (Document Store Service)
  mongodb:
    image: mongo:latest
    container_name: saas_ai_mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - saas_network

  # 2. Serviço de API Backend Express/TypeScript (Backend RESTful API Engine)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saas_ai_backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/saask_store_ai
      - JWT_SECRET=super_secret_jwt_key_saas_multi_tenant_2026_senior_key
      - JWT_EXPIRES_IN=7d
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - saas_network

  # 3. Serviço de Interface Frontend React/Vite/Nginx (Single Page Application Web Interface)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saas_ai_frontend
    restart: always
    ports:
      - '3000:80'
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - saas_network

# Volumes Persistentes (Persistent Volumes Definition)
volumes:
  mongodb_data:
    driver: local

# Redes Isoladas da Aplicação (Isolated Application Overlay Networks)
networks:
  saas_network:
    driver: bridge
